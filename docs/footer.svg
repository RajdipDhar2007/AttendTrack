<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
<stop offset="0" stop-color="#150B2E"/>
<stop offset="1" stop-color="#0B1020"/>
</linearGradient>
<linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#38BDF8"><animate attributeName="stop-color" values="#38BDF8;#A78BFA;#F472B6;#34D399;#38BDF8" dur="8s" repeatCount="indefinite"/></stop>
<stop offset="1" stop-color="#F472B6"><animate attributeName="stop-color" values="#F472B6;#34D399;#38BDF8;#A78BFA;#F472B6" dur="8s" repeatCount="indefinite"/></stop>
</linearGradient>
<linearGradient id="btn" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#F59E0B"/>
<stop offset="1" stop-color="#EC4899"/>
</linearGradient>
<linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#6366F1" stop-opacity="0.55"/>
<stop offset="1" stop-color="#EC4899" stop-opacity="0.55"/>
</linearGradient>
<linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#06B6D4" stop-opacity="0.45"/>
<stop offset="1" stop-color="#8B5CF6" stop-opacity="0.45"/>
</linearGradient>
<linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
<stop offset="0" stop-color="#fff" stop-opacity="0"/>
<stop offset="0.5" stop-color="#fff" stop-opacity="0.45"/>
<stop offset="1" stop-color="#fff" stop-opacity="0"/>
</linearGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#fff" stroke-opacity="0.05"/></pattern>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="45"/></filter>
<filter id="glow" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
<clipPath id="frame"><rect width="1200" height="380" rx="30"/></clipPath>
<clipPath id="btnclip"><rect x="440" y="168" width="320" height="64" rx="32"/></clipPath>
<path id="star" d="M0,-14 L4,-4 L14,-3 L6,4 L9,14 L0,8 L-9,14 L-6,4 L-14,-3 L-4,-4 Z"/>
</defs>

<g clip-path="url(#frame)">
<rect width="1200" height="380" fill="url(#bg)"/>

<g filter="url(#blur)" opacity="0.6">
<circle r="120" fill="#8B5CF6"><animateMotion dur="18s" repeatCount="indefinite" path="M200,100 C450,300 750,40 1000,200 C750,60 450,280 200,100"/></circle>
<circle r="100" fill="#EC4899"><animateMotion dur="22s" repeatCount="indefinite" path="M1000,80 C700,300 300,50 160,240 C360,50 760,320 1000,80"/></circle>
</g>
<rect width="1200" height="380" fill="url(#grid)"/>

<!-- twinkling stars -->
<g fill="#fff">
<circle cx="80" cy="60" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="210" cy="140" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.1s" begin="0.5s" repeatCount="indefinite"/></circle>
<circle cx="330" cy="50" r="2.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" begin="1s" repeatCount="indefinite"/></circle>
<circle cx="900" cy="45" r="2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.6s" begin="0.3s" repeatCount="indefinite"/></circle>
<circle cx="1040" cy="130" r="1.8"><animate attributeName="opacity" values="0.1;1;0.1" dur="3.3s" begin="1.2s" repeatCount="indefinite"/></circle>
<circle cx="1130" cy="60" r="2.2"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.2s" begin="0.8s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="30" r="1.6"><animate attributeName="opacity" values="0.1;1;0.1" dur="3s" begin="1.6s" repeatCount="indefinite"/></circle>
</g>

<!-- headline -->
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle">
<text x="600" y="78" font-size="22" fill="#E2E8F0" letter-spacing="6" opacity="0.85">ENJOYING ATTENDTRACK?</text>
<text x="600" y="132" font-size="46" font-weight="800" fill="url(#txt)" filter="url(#glow)">Never miss a class count again</text>
</g>

<!-- star button -->
<g font-family="Segoe UI, Helvetica, Arial, sans-serif">
<g>
<animateTransform attributeName="transform" type="scale" additive="sum" values="1;1" dur="1s" repeatCount="indefinite"/>
<rect x="436" y="164" width="328" height="72" rx="36" fill="url(#btn)" opacity="0.5" filter="url(#glow)">
<animate attributeName="opacity" values="0.25;0.7;0.25" dur="2.4s" repeatCount="indefinite"/>
</rect>
<rect x="440" y="168" width="320" height="64" rx="32" fill="url(#btn)"/>
<g clip-path="url(#btnclip)">
<rect x="-120" y="168" width="100" height="64" fill="url(#shine)" transform="skewX(-20)">
<animate attributeName="x" values="380;900" dur="2.8s" repeatCount="indefinite"/>
</rect>
</g>
<use href="#star" x="494" y="200" fill="#fff">
<animateTransform attributeName="transform" type="rotate" values="0 494 200;360 494 200" dur="6s" repeatCount="indefinite"/>
</use>
<text x="526" y="209" font-size="24" font-weight="800" fill="#fff" letter-spacing="1">Star this repo</text>
</g>
</g>

<!-- floating stars rising from button -->
<g fill="#FBBF24">
<use href="#star" x="470" y="160" transform="scale(0.5)" opacity="0"/>
<circle cx="470" cy="160" r="3"><animate attributeName="cy" values="160;100" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.4s" repeatCount="indefinite"/></circle>
<circle cx="600" cy="160" r="2.5"><animate attributeName="cy" values="160;96" dur="2.9s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.9s" begin="0.6s" repeatCount="indefinite"/></circle>
<circle cx="730" cy="160" r="3"><animate attributeName="cy" values="160;100" dur="2.6s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="2.6s" begin="1.1s" repeatCount="indefinite"/></circle>
</g>

<!-- equalizer / attendance bars -->
<g transform="translate(120 330)" fill="#38BDF8" opacity="0.85">
<rect x="0" width="10" height="10" y="-10" rx="3"><animate attributeName="height" values="10;60;10" dur="1.6s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-60;-10" dur="1.6s" repeatCount="indefinite"/></rect>
<rect x="18" width="10" height="10" y="-10" rx="3" fill="#A78BFA"><animate attributeName="height" values="30;10;50;30" dur="1.9s" repeatCount="indefinite"/><animate attributeName="y" values="-30;-10;-50;-30" dur="1.9s" repeatCount="indefinite"/></rect>
<rect x="36" width="10" height="10" y="-10" rx="3" fill="#F472B6"><animate attributeName="height" values="20;55;15;20" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="-20;-55;-15;-20" dur="1.4s" repeatCount="indefinite"/></rect>
<rect x="54" width="10" height="10" y="-10" rx="3" fill="#34D399"><animate attributeName="height" values="45;15;60;45" dur="2.1s" repeatCount="indefinite"/><animate attributeName="y" values="-45;-15;-60;-45" dur="2.1s" repeatCount="indefinite"/></rect>
<rect x="72" width="10" height="10" y="-10" rx="3"><animate attributeName="height" values="15;50;25;15" dur="1.7s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-50;-25;-15" dur="1.7s" repeatCount="indefinite"/></rect>
</g>
<g transform="translate(1000 330)" opacity="0.85">
<rect x="0" width="10" height="10" y="-10" rx="3" fill="#34D399"><animate attributeName="height" values="50;15;40;50" dur="1.8s" repeatCount="indefinite"/><animate attributeName="y" values="-50;-15;-40;-50" dur="1.8s" repeatCount="indefinite"/></rect>
<rect x="18" width="10" height="10" y="-10" rx="3" fill="#F472B6"><animate attributeName="height" values="15;55;20;15" dur="1.5s" repeatCount="indefinite"/><animate attributeName="y" values="-15;-55;-20;-15" dur="1.5s" repeatCount="indefinite"/></rect>
<rect x="36" width="10" height="10" y="-10" rx="3" fill="#A78BFA"><animate attributeName="height" values="35;60;10;35" dur="2s" repeatCount="indefinite"/><animate attributeName="y" values="-35;-60;-10;-35" dur="2s" repeatCount="indefinite"/></rect>
<rect x="54" width="10" height="10" y="-10" rx="3" fill="#38BDF8"><animate attributeName="height" values="10;45;25;10" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="-10;-45;-25;-10" dur="1.3s" repeatCount="indefinite"/></rect>
<rect x="72" width="10" height="10" y="-10" rx="3" fill="#FBBF24"><animate attributeName="height" values="40;20;55;40" dur="1.75s" repeatCount="indefinite"/><animate attributeName="y" values="-40;-20;-55;-40" dur="1.75s" repeatCount="indefinite"/></rect>
</g>

<!-- chips -->
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#fff" text-anchor="middle">
<g><rect x="370" y="262" width="130" height="30" rx="15" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.2"/><text x="435" y="282">Kotlin</text></g>
<g><rect x="510" y="262" width="180" height="30" rx="15" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.2"/><text x="600" y="282">Jetpack Compose</text></g>
<g><rect x="700" y="262" width="130" height="30" rx="15" fill="#fff" fill-opacity="0.08" stroke="#fff" stroke-opacity="0.2"/><text x="765" y="282">Gemini AI</text></g>
<animateTransform attributeName="transform" type="translate" values="0 0;0 -4;0 0" dur="4s" repeatCount="indefinite"/>
</g>

<!-- made with love -->
<g font-family="Segoe UI, Helvetica, Arial, sans-serif" text-anchor="middle" fill="#E2E8F0" font-size="17">
<text x="600" y="326">Made with <tspan fill="#F43F5E">&#9829;<animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/></tspan> by <tspan font-weight="700" fill="url(#txt)">Rajdip Dhar</tspan></text>
</g>

<!-- waves -->
<path d="M0,345 C150,320 300,370 450,345 C600,320 750,370 900,345 C1050,320 1150,365 1200,345 L1200,380 L0,380 Z" fill="url(#w1)">
<animate attributeName="d" dur="7s" repeatCount="indefinite" values="M0,345 C150,320 300,370 450,345 C600,320 750,370 900,345 C1050,320 1150,365 1200,345 L1200,380 L0,380 Z;M0,350 C150,375 300,325 450,350 C600,375 750,325 900,350 C1050,375 1150,330 1200,350 L1200,380 L0,380 Z;M0,345 C150,320 300,370 450,345 C600,320 750,370 900,345 C1050,320 1150,365 1200,345 L1200,380 L0,380 Z"/>
</path>
<path d="M0,358 C200,340 350,375 600,358 C850,340 1000,375 1200,358 L1200,380 L0,380 Z" fill="url(#w2)">
<animate attributeName="d" dur="5s" repeatCount="indefinite" values="M0,358 C200,340 350,375 600,358 C850,340 1000,375 1200,358 L1200,380 L0,380 Z;M0,362 C200,378 350,345 600,362 C850,378 1000,345 1200,362 L1200,380 L0,380 Z;M0,358 C200,340 350,375 600,358 C850,340 1000,375 1200,358 L1200,380 L0,380 Z"/>
</path>

<rect x="1" y="1" width="1198" height="378" rx="29" fill="none" stroke="#fff" stroke-opacity="0.15"/>
</g>
</svg>
